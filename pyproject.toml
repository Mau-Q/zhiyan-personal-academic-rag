[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyan-personal-academic-rag"
version = "0.1.0"
description = "Contract-first personal academic-space RAG system"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pypdf>=5.7,<7",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "jsonschema>=4.23,<5",
]
server = [
  "uvicorn>=0.34,<1",
]
milvus = [
  "pymilvus>=2.6,<2.7",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
reranker = [
  "httpx[socks]>=0.28,<0.29",
  "sentence-transformers>=5.6,<5.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.storage" = ["migrations/*.sql"]
