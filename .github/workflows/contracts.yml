name: Contract tests

on:
  pull_request:
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "tests/contracts/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "tests/contracts/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install contract-test dependency
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate contracts and fixtures
        run: make contract-test
