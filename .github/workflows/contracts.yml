name: Core tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "contracts/**"
      - "backend/**"
      - "docs/**"
      - "evaluation/**"
      - "fixtures/**"
      - "machine/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "contracts/**"
      - "backend/**"
      - "docs/**"
      - "evaluation/**"
      - "fixtures/**"
      - "machine/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install '.[dev]'
      - name: Validate repository Harness and core system
        run: make test
